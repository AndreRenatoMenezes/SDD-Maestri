<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-label="SDD Maestri — Spec-Driven Development para times de agentes de IA">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="55%" stop-color="#161b22"/>
      <stop offset="100%" stop-color="#1c2333"/>
    </linearGradient>
    <linearGradient id="blade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8957e5" stop-opacity="0"/>
      <stop offset="18%" stop-color="#8957e5"/>
      <stop offset="52%" stop-color="#58a6ff"/>
      <stop offset="86%" stop-color="#39d3bb"/>
      <stop offset="100%" stop-color="#39d3bb" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="hilt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c9d1d9"/>
      <stop offset="50%" stop-color="#8b949e"/>
      <stop offset="100%" stop-color="#5b6470"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-400%" width="200%" height="900%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softglow" x="-30%" y="-60%" width="160%" height="220%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="340" fill="url(#bg)"/>

  <!-- campo de estrelas -->
  <g fill="#ffffff">
    <circle cx="70" cy="52" r="1.6" opacity=".7"/><circle cx="148" cy="96" r="1" opacity=".45"/>
    <circle cx="212" cy="40" r="1.3" opacity=".6"/><circle cx="286" cy="78" r="1" opacity=".35"/>
    <circle cx="344" cy="34" r="1.8" opacity=".8"/><circle cx="420" cy="88" r="1" opacity=".4"/>
    <circle cx="498" cy="46" r="1.2" opacity=".55"/><circle cx="574" cy="30" r="1" opacity=".35"/>
    <circle cx="646" cy="84" r="1.5" opacity=".65"/><circle cx="722" cy="44" r="1" opacity=".4"/>
    <circle cx="798" cy="72" r="1.7" opacity=".75"/><circle cx="872" cy="36" r="1.1" opacity=".5"/>
    <circle cx="946" cy="90" r="1" opacity=".35"/><circle cx="1016" cy="50" r="1.6" opacity=".7"/>
    <circle cx="1092" cy="80" r="1.2" opacity=".5"/><circle cx="1150" cy="38" r="1" opacity=".4"/>
    <circle cx="96" cy="268" r="1.3" opacity=".55"/><circle cx="184" cy="300" r="1" opacity=".35"/>
    <circle cx="272" cy="256" r="1.6" opacity=".7"/><circle cx="368" cy="298" r="1" opacity=".4"/>
    <circle cx="470" cy="272" r="1.2" opacity=".5"/><circle cx="580" cy="306" r="1" opacity=".3"/>
    <circle cx="690" cy="264" r="1.5" opacity=".6"/><circle cx="790" cy="302" r="1" opacity=".38"/>
    <circle cx="884" cy="270" r="1.3" opacity=".55"/><circle cx="982" cy="298" r="1" opacity=".35"/>
    <circle cx="1074" cy="262" r="1.7" opacity=".7"/><circle cx="1148" cy="296" r="1.1" opacity=".45"/>
  </g>

  <!-- título -->
  <text x="600" y="132" text-anchor="middle" font-family="'Segoe UI Semibold','Helvetica Neue',Helvetica,Arial,sans-serif"
        font-size="76" font-weight="700" letter-spacing="14" fill="#ffffff" filter="url(#softglow)">SDD MAESTRI</text>

  <!-- batuta-sabre -->
  <g transform="translate(28,186)">
    <rect x="292" y="-3.5" width="620" height="7" rx="3.5" fill="url(#blade)" filter="url(#glow)"/>
    <rect x="292" y="-1.4" width="620" height="2.8" rx="1.4" fill="#ffffff" opacity=".92"/>
    <g transform="translate(232,0)">
      <rect x="0" y="-8" width="62" height="16" rx="4" fill="url(#hilt)"/>
      <rect x="52" y="-10" width="10" height="20" rx="3" fill="#c9d1d9"/>
      <rect x="12" y="-8" width="4" height="16" fill="#30363d" opacity=".85"/>
      <rect x="22" y="-8" width="4" height="16" fill="#30363d" opacity=".85"/>
      <rect x="32" y="-8" width="4" height="16" fill="#30363d" opacity=".85"/>
      <circle cx="7" cy="0" r="3.2" fill="#39d3bb"/>
    </g>
  </g>

  <!-- subtítulo -->
  <text x="600" y="240" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif"
        font-size="25" font-weight="600" fill="#c9d1d9">Spec-Driven Development para times de agentes de IA</text>
  <text x="600" y="278" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif"
        font-size="17" fill="#8b949e">Um contrato antes da primeira linha de código · Fronteiras que não se cruzam</text>
</svg>
