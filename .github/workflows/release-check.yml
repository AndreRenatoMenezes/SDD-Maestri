name: release-check

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  manifests:
    name: Manifestos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: JSON válido
        run: |
          jq empty .claude-plugin/plugin.json
          jq empty .claude-plugin/marketplace.json

      - name: A skill existe onde o plugin diz
        run: |
          test -f skills/sdd-maestri/SKILL.md

      - name: O source do marketplace resolve
        run: |
          SOURCE=$(jq -r '.plugins[0].source' .claude-plugin/marketplace.json)
          test -d "$SOURCE"

      - name: Nome do plugin bate entre os dois manifestos
        run: |
          PLUGIN=$(jq -r .name .claude-plugin/plugin.json)
          ENTRY=$(jq -r '.plugins[0].name' .claude-plugin/marketplace.json)
          if [ "$PLUGIN" != "$ENTRY" ]; then
            echo "plugin.json diz '$PLUGIN', marketplace.json diz '$ENTRY'"
            exit 1
          fi

  version:
    name: Versão bate com a tag
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Sem isto, uma release sai com o version antigo e ninguém recebe a
      # atualização: o Claude Code só reinstala quando o campo muda.
      - name: Comparar tag e plugin.json
        run: |
          TAG=${GITHUB_REF_NAME#v}
          PLUGIN=$(jq -r .version .claude-plugin/plugin.json)
          if [ "$TAG" != "$PLUGIN" ]; then
            echo "tag $TAG != plugin.json $PLUGIN — bumpe o manifesto antes de taguear"
            exit 1
          fi
